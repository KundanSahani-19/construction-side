<div class="login-page">

  <div class="login-card">

    <div class="login-brand">
      <div class="brand-icon">
        CS
      </div>

      <div>
        <h1>Construction Side</h1>
        <p>Management System</p>
      </div>
    </div>

    <div class="login-header">
      <h2>Welcome Back</h2>
      <p>Login to continue to your dashboard</p>
    </div>

    <form (ngSubmit)="login()">

      <!-- EMAIL -->

      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          autocomplete="email"
          [disabled]="loading"
        />

      </div>


      <!-- PASSWORD -->

      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          [disabled]="loading"
        />

      </div>


      <!-- ERROR -->

      @if (errorMessage) {

        <div class="error-message">
          {{ errorMessage }}
        </div>

      }


      <!-- LOGIN BUTTON -->

      <button
        type="submit"
        class="login-btn"
        [disabled]="loading"
      >

        @if (loading) {

          <span class="spinner"></span>
          Logging in...

        } @else {

          Login

        }

      </button>

    </form>

    <div class="login-footer">
      <span>Secure access</span>
      <span>•</span>
      <span>Construction Management</span>
    </div>

  </div>

</div>
